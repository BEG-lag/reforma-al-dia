[project]
name = "reforma-al-dia"
version = "0.1.0"
description = "The morning the DOF publishes a reform, an AI agent applies it to leyes-mx and opens a pull request for a human to review. Then it audits itself against the official text."
readme = "README.md"
authors = [
    { name = "Benjamín Esponda García", email = "272673676+BEG-lag@users.noreply.github.com" }
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mexico", "law", "legislation", "dof", "legal-tech", "claude", "ai-agent", "human-in-the-loop"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Natural Language :: Spanish",
    "Intended Audience :: Legal Industry",
    "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27,<1",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/BEG-lag/reforma-al-dia"
Source = "https://github.com/BEG-lag/reforma-al-dia"
Scoreboard = "https://beg-lag.github.io/reforma-al-dia/"
Author = "https://pivotek.mx"

[project.scripts]
reforma-al-dia = "reforma_al_dia.cli:main"

[build-system]
requires = ["uv_build>=0.8,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
